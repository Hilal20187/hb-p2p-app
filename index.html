<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HB P2P - Secure Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-area">
            <div class="crown-logo">👑</div>
            <div>
                <h1 class="brand-title">HB P2P</h1>
                <p class="brand-sub">Secure Marketplace</p>
            </div>
        </div>
        <div class="header-icons">
            <button class="icon-btn">🔔</button>
            <button class="icon-btn">💬 3</button>
            <div class="user-avatar-sm">U</div>
        </div>
    </header>

    <!-- Balance Card -->
    <div class="balance-card">
        <div class="balance-header">Total Balance 👁️</div>
        <div class="balance-amount">€ 445.10</div>
        <div class="balance-actions">
            <button class="action-btn deposit-btn">⬇ Deposit</button>
            <button class="action-btn withdraw-btn">⬆ Withdraw</button>
        </div>
    </div>

    <div class="tabs-container">
        <button class="tab-btn active">Marketplace</button>
        <button class="tab-btn">My Trades</button>
        <button class="tab-btn">Favorites</button>
    </div>

    <main class="container">
        <!-- Offer 1 -->
        <div class="offer-card">
            <div class="merchant-info">
                <div class="merchant-left">
                    <div class="merchant-avatar">M</div>
                    <div>
                        <span class="merchant-name">Merchant Pro</span> <span class="verified-badge">✔</span>
                        <div style="font-size: 0.75rem; color: #94a3b8;">⭐ 98.7% • 126 trades</div>
                    </div>
                </div>
                <span class="online-status">● Online</span>
            </div>
            <div class="offer-details">
                <div>
                    <span class="price-label">Price per USDT</span>
                    <span class="price">0.88 EUR</span>
                </div>
                <div class="available-box">
                    <span class="price-label">Available</span>
                    <span class="available-val">523.65 USDT</span>
                </div>
            </div>
            <div class="payment-methods">
                <span class="tag">SEPA Transfer</span>
            </div>
            <button onclick="openTradeModal('Merchant Pro', '0.88')" class="buy-btn">Buy</button>
        </div>

        <!-- Offer 2 -->
        <div class="offer-card">
            <div class="merchant-info">
                <div class="merchant-left">
                    <div class="merchant-avatar" style="background:#1e3a8a;">A</div>
                    <div>
                        <span class="merchant-name">Alpha Exchange</span> <span class="verified-badge">✔</span>
                        <div style="font-size: 0.75rem; color: #94a3b8;">⭐ 99.4% • 312 trades</div>
                    </div>
                </div>
                <span class="online-status">● Online</span>
            </div>
            <div class="offer-details">
                <div>
                    <span class="price-label">Price per USDT</span>
                    <span class="price">0.89 EUR</span>
                </div>
                <div class="available-box">
                    <span class="price-label">Available</span>
                    <span class="available-val">1,240.50 USDT</span>
                </div>
            </div>
            <div class="payment-methods">
                <span class="tag">Revolut</span>
            </div>
            <button onclick="openTradeModal('Alpha Exchange', '0.89')" class="buy-btn">Buy</button>
        </div>
    </main>

    <!-- Trade Modal -->
    <div id="tradeModal" class="modal">
        <div class="modal-content">
            <h3>Buy USDT from <span id="modalMerchant"></span></h3>
            <p style="color: #94a3b8; font-size: 0.85rem;">Rate: <span id="modalPrice"></span> EUR</p>
            <input type="number" placeholder="Enter amount in EUR" class="trade-input">
            <div class="modal-actions">
                <button onclick="closeTradeModal()" class="cancel-btn">Cancel</button>
                <button onclick="confirmTrade()" class="confirm-btn">Confirm Order</button>
            </div>
        </div>
    </div>

    <script>
        function openTradeModal(merchant, price) {
            document.getElementById('modalMerchant').innerText = merchant;
            document.getElementById('modalPrice').innerText = price;
            document.getElementById('tradeModal').style.display = 'flex';
        }
        function closeTradeModal() {
            document.getElementById('tradeModal').style.display = 'none';
        }
        function confirmTrade() {
            alert('Order created successfully!');
            closeTradeModal();
        }
    </script>
</body>
</html>
